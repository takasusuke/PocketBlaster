<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PocketBlaster コントローラー</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b12; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #app {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 20px; padding: 16px; box-sizing: border-box; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  #status {
    font-size: 15px; line-height: 1.6; white-space: pre-wrap;
    background: #16161f; border-radius: 12px; padding: 12px 16px; width: 100%; max-width: 360px;
    box-sizing: border-box;
  }
  #status.connected { color: #7CFFB2; }
  #status.error { color: #FF8A8A; }
  button {
    font-size: 18px; padding: 16px 28px; border-radius: 14px; border: none;
    width: 100%; max-width: 360px; box-sizing: border-box;
  }
  #connectBtn { background: #4C6FFF; color: white; }
  #connectBtn:disabled { background: #333; color: #888; }
  #shootBtn { background: #E23B3B; color: white; font-size: 22px; padding: 28px; }
  #shootBtn:disabled { background: #333; color: #888; }
  #reloadBtn { background: #FF7A45; color: white; }
  #reloadBtn:disabled { background: #333; color: #888; }
  #raw { font-size: 12px; color: #888; }
  #axisSettings {
    width: 100%; max-width: 360px; box-sizing: border-box;
    background: #16161f; border-radius: 12px; padding: 12px 16px;
    font-size: 14px; text-align: left;
  }
  #axisSettings summary { cursor: pointer; font-size: 15px; }
  #axisSettings .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  #axisSettings select { font-size: 14px; padding: 4px; }
</style>
</head>
<body>
<div id="app">
  <h1>PocketBlaster コントローラー</h1>
  <div id="status">未接続</div>
  <details id="axisSettings">
    <summary>持ち方の設定（上下左右が合わない時に調整）</summary>
    <div class="row">
      <label for="verticalAxisSelect">上下方向として使うセンサー軸</label>
      <select id="verticalAxisSelect">
        <option value="beta">前後方向の傾き(beta)</option>
        <option value="gamma">左右方向の傾き(gamma)</option>
      </select>
    </div>
    <div class="row">
      <label for="invertVertical">上下を反転する</label>
      <input type="checkbox" id="invertVertical">
    </div>
    <div class="row">
      <label for="invertHorizontal">左右を反転する</label>
      <input type="checkbox" id="invertHorizontal">
    </div>
  </details>
  <button id="connectBtn">接続する</button>
  <button id="shootBtn" disabled>撃つ</button>
  <button id="reloadBtn" disabled>リロード（弾を補充し、狙いを基準位置にリセット）</button>
  <div id="raw"></div>
</div>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var connectBtn = document.getElementById('connectBtn');
  var shootBtn = document.getElementById('shootBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var rawEl = document.getElementById('raw');
  var verticalAxisSelect = document.getElementById('verticalAxisSelect');
  var invertVerticalCheckbox = document.getElementById('invertVertical');
  var invertHorizontalCheckbox = document.getElementById('invertHorizontal');

  var ws = null;
  var lastSentAt = 0;
  var sendIntervalMs = 50; // 約20Hz。送りすぎるとWebSocketフレームが詰まるため間引く

  // 持ち方(銃のように構える角度)によって、実際の上下左右の動きがbeta/gammaの
  // どちらに出るか・符号がどちらかが変わる(DeviceOrientationEventは端末自身の
  // 持ち方ではなく固定された基準に対する角度のため)。ここで吸収し、Unity側には
  // 常に「betaが上下、gammaが左右」として送る — Unity側の変更を不要にするため。
  var AXIS_SETTINGS_KEY = 'pocketblaster.axisSettings';

  function loadAxisSettings() {
    try {
      var saved = JSON.parse(localStorage.getItem(AXIS_SETTINGS_KEY) || '{}');
      verticalAxisSelect.value = saved.verticalAxis === 'gamma' ? 'gamma' : 'beta';
      invertVerticalCheckbox.checked = !!saved.invertVertical;
      invertHorizontalCheckbox.checked = !!saved.invertHorizontal;
    } catch (e) { /* 保存内容が壊れていたら既定値のまま使う */ }
  }

  function saveAxisSettings() {
    try {
      localStorage.setItem(AXIS_SETTINGS_KEY, JSON.stringify({
        verticalAxis: verticalAxisSelect.value,
        invertVertical: invertVerticalCheckbox.checked,
        invertHorizontal: invertHorizontalCheckbox.checked
      }));
    } catch (e) { /* 保存できなくても致命的ではない */ }
  }

  function remapOrientation(rawBeta, rawGamma) {
    var verticalRaw = verticalAxisSelect.value === 'gamma' ? rawGamma : rawBeta;
    var horizontalRaw = verticalAxisSelect.value === 'gamma' ? rawBeta : rawGamma;
    var vertical = invertVerticalCheckbox.checked ? -verticalRaw : verticalRaw;
    var horizontal = invertHorizontalCheckbox.checked ? -horizontalRaw : horizontalRaw;
    return { beta: vertical, gamma: horizontal };
  }

  [verticalAxisSelect, invertVerticalCheckbox, invertHorizontalCheckbox].forEach(function (el) {
    el.addEventListener('change', saveAxisSettings);
  });
  loadAxisSettings();

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function connectWebSocket() {
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var url = scheme + location.host + '/';
    ws = new WebSocket(url);

    ws.onopen = function () {
      setStatus('接続済み\n' + url, 'connected');
      shootBtn.disabled = false;
      reloadBtn.disabled = false;
      verticalAxisSelect.disabled = true;
      invertVerticalCheckbox.disabled = true;
      invertHorizontalCheckbox.disabled = true;
    };
    ws.onclose = function () {
      setStatus('切断されました。もう一度「接続する」を押してください', 'error');
      shootBtn.disabled = true;
      reloadBtn.disabled = true;
      verticalAxisSelect.disabled = false;
      invertVerticalCheckbox.disabled = false;
      invertHorizontalCheckbox.disabled = false;
    };
    ws.onerror = function () {
      setStatus('接続エラー。PCと同じWi-Fiに接続しているか確認してください', 'error');
    };
  }

  function sendOrientation(alpha, beta, gamma) {
    var now = Date.now();
    if (now - lastSentAt < sendIntervalMs) return;
    lastSentAt = now;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'orientation', alpha: alpha || 0, beta: beta || 0, gamma: gamma || 0 }));
  }

  function onDeviceOrientation(e) {
    var rawBeta = e.beta || 0;
    var rawGamma = e.gamma || 0;
    rawEl.textContent = 'alpha=' + (e.alpha || 0).toFixed(1) +
      ' beta=' + rawBeta.toFixed(1) +
      ' gamma=' + rawGamma.toFixed(1);
    var remapped = remapOrientation(rawBeta, rawGamma);
    sendOrientation(e.alpha, remapped.beta, remapped.gamma);
  }

  function startOrientationStream() {
    window.addEventListener('deviceorientation', onDeviceOrientation);
  }

  function requestOrientationPermissionIfNeeded() {
    // iOS Safariはユーザー操作起点でのみ許可を要求できる
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      return DeviceOrientationEvent.requestPermission().then(function (result) {
        if (result !== 'granted') {
          throw new Error('センサーの利用が許可されませんでした');
        }
      });
    }
    return Promise.resolve();
  }

  function requestWakeLockBestEffort() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(function () { /* 失敗しても無視してよい */ });
    }
  }

  connectBtn.addEventListener('click', function () {
    connectBtn.disabled = true;
    setStatus('接続中...');
    requestOrientationPermissionIfNeeded()
      .then(function () {
        requestWakeLockBestEffort();
        startOrientationStream();
        connectWebSocket();
      })
      .catch(function (err) {
        setStatus(String(err.message || err), 'error');
        connectBtn.disabled = false;
      });
  });

  shootBtn.addEventListener('click', function () {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'shoot' }));
  });

  reloadBtn.addEventListener('click', function () {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'reload' }));
  });
})();
</script>
</body>
</html>
