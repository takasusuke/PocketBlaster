<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PocketBlaster コントローラー</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b12; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #app {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 20px; padding: 16px; box-sizing: border-box; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  #status {
    font-size: 15px; line-height: 1.6; white-space: pre-wrap;
    background: #16161f; border-radius: 12px; padding: 12px 16px; width: 100%; max-width: 360px;
    box-sizing: border-box;
  }
  #status.connected { color: #7CFFB2; }
  #status.error { color: #FF8A8A; }
  button {
    font-size: 18px; padding: 16px 28px; border-radius: 14px; border: none;
    width: 100%; max-width: 360px; box-sizing: border-box;
  }
  #connectBtn { background: #4C6FFF; color: white; }
  #connectBtn:disabled { background: #333; color: #888; }
  #shootBtn { background: #E23B3B; color: white; font-size: 32px; font-weight: 700; padding: 40px; max-width: 420px; }
  #shootBtn:disabled { background: #333; color: #888; }
  #reloadBtn { background: #FF7A45; color: white; font-size: 24px; font-weight: 600; padding: 26px; max-width: 420px; }
  #reloadBtn:disabled { background: #333; color: #888; }
  #subControls { display: flex; gap: 12px; width: 100%; max-width: 360px; }
  #pauseBtn, #retryBtn { background: #2A2A38; color: #ddd; font-size: 15px; padding: 12px; }
  #pauseBtn:disabled, #retryBtn:disabled { background: #222; color: #666; }
  #raw { font-size: 12px; color: #888; }
  #stepStatus { font-size: 13px; color: #aaa; }
  #axisSettings {
    width: 100%; max-width: 360px; box-sizing: border-box;
    background: #16161f; border-radius: 12px; padding: 12px 16px;
    font-size: 14px; text-align: left;
  }
  #axisSettings summary { cursor: pointer; font-size: 15px; }
  #axisSettings .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  #axisSettings select { font-size: 14px; padding: 4px; }
</style>
</head>
<body>
<div id="app">
  <h1>PocketBlaster コントローラー</h1>
  <div id="status">未接続</div>
  <details id="axisSettings" open>
    <summary>持ち方の設定（接続中でも変更可。変更後は「リロード」で基準をリセット）</summary>
    <div class="row">
      <label for="verticalAxisSelect">上下方向</label>
      <select id="verticalAxisSelect">
        <option value="beta">前後の傾き(beta)</option>
        <option value="gamma">左右の傾き(gamma)</option>
      </select>
    </div>
    <div class="row">
      <label for="horizontalAxisSelect">左右方向</label>
      <select id="horizontalAxisSelect">
        <option value="gamma">左右の傾き(gamma)</option>
        <option value="alpha">水平方向の回転(alpha)</option>
      </select>
    </div>
    <div class="row">
      <label for="invertVertical">上下を反転する</label>
      <input type="checkbox" id="invertVertical">
    </div>
    <div class="row">
      <label for="invertHorizontal">左右を反転する</label>
      <input type="checkbox" id="invertHorizontal">
    </div>
  </details>
  <button id="connectBtn">接続する</button>
  <button id="shootBtn" disabled>撃つ</button>
  <button id="reloadBtn" disabled>リロード（弾を補充し、狙いを基準位置にリセット）</button>
  <div id="subControls">
    <button id="pauseBtn" disabled>一時停止</button>
    <button id="retryBtn" disabled>再挑戦</button>
  </div>
  <div id="raw"></div>
  <div id="stepStatus">歩数: <span id="stepCount">0</span>（狙っている方向へ移動）</div>
</div>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var connectBtn = document.getElementById('connectBtn');
  var shootBtn = document.getElementById('shootBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var retryBtn = document.getElementById('retryBtn');
  var rawEl = document.getElementById('raw');
  var stepCountEl = document.getElementById('stepCount');
  var verticalAxisSelect = document.getElementById('verticalAxisSelect');
  var horizontalAxisSelect = document.getElementById('horizontalAxisSelect');
  var invertVerticalCheckbox = document.getElementById('invertVertical');
  var invertHorizontalCheckbox = document.getElementById('invertHorizontal');

  var ws = null;
  var lastSentAt = 0;
  var sendIntervalMs = 50; // 約20Hz。送りすぎるとWebSocketフレームが詰まるため間引く

  // 持ち方(銃のように構える角度)によって、実際の上下左右の動きがalpha/beta/gammaの
  // どれに・どの符号で出るかが変わる(DeviceOrientationEventは端末自身の持ち方ではなく
  // 固定された基準に対する角度のため)。ここで吸収し、Unity側には常に「betaが上下、
  // gammaが左右」として送る — Unity側の変更を不要にするため。
  // 「左右」はスマホを傾ける(gamma)だけでなく、スマホ自体を水平に回転させる(alpha、
  // 銃口を横に振るイメージ)でも選べるようにしてある。
  // 設定は接続中でも変更できる(即座に反映される) — 変更後は基準がずれるので
  // 「リロード」を押して構え直すことを想定している。
  var AXIS_SETTINGS_KEY = 'pocketblaster.axisSettings';

  function loadAxisSettings() {
    try {
      var saved = JSON.parse(localStorage.getItem(AXIS_SETTINGS_KEY) || '{}');
      verticalAxisSelect.value = saved.verticalAxis === 'gamma' ? 'gamma' : 'beta';
      horizontalAxisSelect.value = saved.horizontalAxis === 'alpha' ? 'alpha' : 'gamma';
      invertVerticalCheckbox.checked = !!saved.invertVertical;
      invertHorizontalCheckbox.checked = !!saved.invertHorizontal;
    } catch (e) { /* 保存内容が壊れていたら既定値のまま使う */ }
  }

  function saveAxisSettings() {
    try {
      localStorage.setItem(AXIS_SETTINGS_KEY, JSON.stringify({
        verticalAxis: verticalAxisSelect.value,
        horizontalAxis: horizontalAxisSelect.value,
        invertVertical: invertVerticalCheckbox.checked,
        invertHorizontal: invertHorizontalCheckbox.checked
      }));
    } catch (e) { /* 保存できなくても致命的ではない */ }
  }

  function remapOrientation(rawAlpha, rawBeta, rawGamma) {
    var verticalRaw = verticalAxisSelect.value === 'gamma' ? rawGamma : rawBeta;
    var horizontalRaw = horizontalAxisSelect.value === 'alpha' ? rawAlpha : rawGamma;
    var vertical = invertVerticalCheckbox.checked ? -verticalRaw : verticalRaw;
    var horizontal = invertHorizontalCheckbox.checked ? -horizontalRaw : horizontalRaw;
    return { beta: vertical, gamma: horizontal };
  }

  [verticalAxisSelect, horizontalAxisSelect, invertVerticalCheckbox, invertHorizontalCheckbox].forEach(function (el) {
    el.addEventListener('change', saveAxisSettings);
  });
  loadAxisSettings();

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function connectWebSocket() {
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var url = scheme + location.host + '/';
    ws = new WebSocket(url);

    ws.onopen = function () {
      setStatus('接続済み\n' + url, 'connected');
      shootBtn.disabled = false;
      reloadBtn.disabled = false;
      pauseBtn.disabled = false;
      retryBtn.disabled = false;
    };
    ws.onclose = function () {
      setStatus('切断されました。もう一度「接続する」を押してください', 'error');
      shootBtn.disabled = true;
      reloadBtn.disabled = true;
      pauseBtn.disabled = true;
      retryBtn.disabled = true;
    };
    ws.onerror = function () {
      setStatus('接続エラー。PCと同じWi-Fiに接続しているか確認してください', 'error');
    };
  }

  function sendOrientation(alpha, beta, gamma) {
    var now = Date.now();
    if (now - lastSentAt < sendIntervalMs) return;
    lastSentAt = now;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'orientation', alpha: alpha || 0, beta: beta || 0, gamma: gamma || 0 }));
  }

  function sendMessage(type) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: type }));
  }

  // --- リロードのジェスチャー検知(オーナー要望、2026-09-06) ---
  // 「スマホを上方向に素早く向けて戻す」動作でリロードする。上下どちら向きが
  // 物理的な「上」に当たるかは持ち方設定(invertVertical)で変わるため符号を仮定せず、
  // remapOrientationで既に補正済みの「上下方向」の値が短時間で大きく振れて
  // 元へ戻る(≒スパイク)パターンだけを見る。ボタンでのリロードは引き続き併用できる。
  var verticalHistory = []; // {t, v}
  var FLICK_WINDOW_MS = 400;
  var FLICK_MIN_SWING_DEG = 25;
  var FLICK_RETURN_TOLERANCE_DEG = 12;
  var FLICK_COOLDOWN_MS = 1000;
  var lastFlickReloadAt = 0;

  function checkReloadFlickGesture(now, verticalValue) {
    verticalHistory.push({ t: now, v: verticalValue });
    while (verticalHistory.length > 0 && now - verticalHistory[0].t > FLICK_WINDOW_MS) {
      verticalHistory.shift();
    }
    if (verticalHistory.length < 3) return false;
    if (now - lastFlickReloadAt < FLICK_COOLDOWN_MS) return false;

    var baseline = verticalHistory[0].v;
    var maxDeviation = 0;
    var peakIndex = 0;
    for (var i = 1; i < verticalHistory.length; i++) {
      var deviation = Math.abs(verticalHistory[i].v - baseline);
      if (deviation > maxDeviation) {
        maxDeviation = deviation;
        peakIndex = i;
      }
    }
    if (maxDeviation < FLICK_MIN_SWING_DEG) return false;

    var latest = verticalHistory[verticalHistory.length - 1].v;
    var returnedToBaseline = Math.abs(latest - baseline) < FLICK_RETURN_TOLERANCE_DEG;
    var peakWasInMiddle = peakIndex > 0 && peakIndex < verticalHistory.length - 1;

    if (returnedToBaseline && peakWasInMiddle) {
      lastFlickReloadAt = now;
      verticalHistory = [];
      return true;
    }
    return false;
  }

  function onDeviceOrientation(e) {
    var rawAlpha = e.alpha || 0;
    var rawBeta = e.beta || 0;
    var rawGamma = e.gamma || 0;
    rawEl.textContent = 'alpha=' + rawAlpha.toFixed(1) +
      ' beta=' + rawBeta.toFixed(1) +
      ' gamma=' + rawGamma.toFixed(1);
    var remapped = remapOrientation(rawAlpha, rawBeta, rawGamma);
    sendOrientation(rawAlpha, remapped.beta, remapped.gamma);

    if (checkReloadFlickGesture(Date.now(), remapped.beta)) {
      sendMessage('reload');
    }
  }

  function startOrientationStream() {
    window.addEventListener('deviceorientation', onDeviceOrientation);
  }

  // --- 足踏み検知でのプレイヤー移動(オーナー要望、2026-09-06) ---
  // 加速度センサーの合成値(重力込み)は、静止時は重力加速度(~9.8)近辺で安定するが、
  // その場で足踏みすると着地の瞬間に大きく跳ね上がる。この跳ね上がりを単純な
  // ローパスフィルタ(移動平均に近い指数平滑化)からの乖離として検出する、
  // 簡易的な歩数計と同じ考え方。
  var smoothedMagnitude = 9.8;
  var SMOOTHING_FACTOR = 0.15;
  var STEP_THRESHOLD = 1.8; // 平滑値からの乖離がこれを超えたら1歩とみなす(要実機調整)
  var STEP_MIN_INTERVAL_MS = 250; // 1歩と数える最短間隔(連続カウント防止)
  var lastStepAt = 0;
  var stepCount = 0;

  function onDeviceMotion(e) {
    var acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null || acc.x === undefined) return;

    var magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
    smoothedMagnitude += (magnitude - smoothedMagnitude) * SMOOTHING_FACTOR;

    var now = Date.now();
    if (magnitude - smoothedMagnitude > STEP_THRESHOLD && now - lastStepAt > STEP_MIN_INTERVAL_MS) {
      lastStepAt = now;
      stepCount++;
      stepCountEl.textContent = String(stepCount);
      sendMessage('step');
    }
  }

  function startMotionStream() {
    window.addEventListener('devicemotion', onDeviceMotion);
  }

  function requestOrientationPermissionIfNeeded() {
    // iOS Safariはユーザー操作起点でのみ許可を要求できる
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      return DeviceOrientationEvent.requestPermission().then(function (result) {
        if (result !== 'granted') {
          throw new Error('センサーの利用が許可されませんでした');
        }
      });
    }
    return Promise.resolve();
  }

  function requestMotionPermissionIfNeeded() {
    // DeviceOrientationEventとは別の許可が必要(iOS Safari)。歩数検知に使う。
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      return DeviceMotionEvent.requestPermission().then(function (result) {
        if (result !== 'granted') {
          throw new Error('モーションセンサーの利用が許可されませんでした(歩数検知に必要)');
        }
      });
    }
    return Promise.resolve();
  }

  function requestWakeLockBestEffort() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(function () { /* 失敗しても無視してよい */ });
    }
  }

  connectBtn.addEventListener('click', function () {
    connectBtn.disabled = true;
    setStatus('接続中...');
    requestOrientationPermissionIfNeeded()
      .then(requestMotionPermissionIfNeeded)
      .then(function () {
        requestWakeLockBestEffort();
        startOrientationStream();
        startMotionStream();
        connectWebSocket();
      })
      .catch(function (err) {
        setStatus(String(err.message || err), 'error');
        connectBtn.disabled = false;
      });
  });

  shootBtn.addEventListener('click', function () {
    sendMessage('shoot');
  });

  reloadBtn.addEventListener('click', function () {
    sendMessage('reload');
  });

  pauseBtn.addEventListener('click', function () {
    sendMessage('pause');
  });

  // 再挑戦はUnity側でシーンを丸ごとリロードする(GameSession参照)。シーン内の
  // サーバーごと作り直されるためこのWebSocket接続も切れる — 再接続が必要になる
  // (未検証・実機確認待ち、docs/HANDOFF.md参照)。
  retryBtn.addEventListener('click', function () {
    sendMessage('retry');
  });
})();
</script>
</body>
</html>
